# Development overrides — LOCAL MACHINES ONLY.
#
# Renamed from docker-compose.override.yml on purpose: Compose auto-loads a file
# named `docker-compose.override.yml`, which meant a bare `docker compose up -d`
# on the production host would have served this file — Development environment
# (Swagger + Scalar published), the API on 0.0.0.0:5001 bypassing Caddy and TLS,
# PostgreSQL on 0.0.0.0:5433, and Seq with authentication disabled on 0.0.0.0:8081.
# It must never be picked up implicitly, so it now requires an explicit -f.
#
# Run dev :  docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Stop dev:  docker compose -f docker-compose.yml -f docker-compose.dev.yml down
# Logs    :  docker compose -f docker-compose.yml -f docker-compose.dev.yml logs -f taxi.api

services:
  taxi.api:
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=TaxiDb_Dev;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      JwtSettings__Secret: ${JWT_SECRET}
      AppSettings__GoogleMapsApiKey: ${GOOGLE_MAPS_API_KEY}
      AppSettings__FirebaseCredentials: ${FIREBASE_CREDENTIALS}
      AppSettings__Stripe__SecretKey: ${STRIPE_SECRET_KEY}
      AppSettings__Stripe__PublishableKey: ${STRIPE_PUBLISHABLE_KEY}
      AppSettings__Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET}
      AppSettings__Features__StripeEnabled: ${STRIPE_ENABLED}
      # Auth — OTP policy (backend-owned)
      Otp__HashSecret: ${OTP_HASH_SECRET}
      Otp__CodeLength: ${OTP_CODE_LENGTH:-6}
      Otp__ExpiryMinutes: ${OTP_EXPIRY_MINUTES:-5}
      Otp__MaxAttempts: ${OTP_MAX_ATTEMPTS:-5}
      Otp__ResendCooldownSeconds: ${OTP_RESEND_COOLDOWN_SECONDS:-60}
      Otp__OtpRetentionDays: ${OTP_RETENTION_DAYS:-30}
      Otp__ReviewBypassRecipient: ${OTP_REVIEW_BYPASS_RECIPIENT:-}
      Otp__ReviewBypassCode: ${OTP_REVIEW_BYPASS_CODE:-}
      # Auth — CM.com SMS
      Sms__CmCom__BaseUrl: ${CM_BASE_URL:-https://gw.messaging.cm.com/}
      Sms__CmCom__ProductToken: ${CM_PRODUCT_TOKEN}
      Sms__CmCom__Sender: ${CM_SENDER:-Fat7i}
      # Auth — Titan.email SMTP
      Email__Titan__Host: ${TITAN_HOST:-smtp.titan.email}
      Email__Titan__Port: ${TITAN_PORT:-465}
      Email__Titan__UseSsl: ${TITAN_USE_SSL:-true}
      Email__Titan__Username: ${TITAN_USERNAME}
      Email__Titan__Password: ${TITAN_PASSWORD}
      Email__Titan__FromEmail: ${TITAN_FROM_EMAIL}
      Email__Titan__FromName: ${TITAN_FROM_NAME:-Fat7i}
      Email__Titan__ReplyToEmail: ${TITAN_REPLY_TO_EMAIL:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://seq:5341/ingest/otlp/v1/traces
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    restart: on-failure

  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: TaxiDb_Dev
    ports:
      - "5433:5432"
    restart: always

  seq:
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:5341"
      - "8081:80"
    restart: unless-stopped

  prometheus:
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    environment:
      # From .env even locally — a hardcoded password in a tracked file becomes the
      # password everyone reuses, and this file is one -f flag away from a real host.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme-local-only}
    ports:
      - "3000:3000"
    restart: unless-stopped
