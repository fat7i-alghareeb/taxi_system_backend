# Production overrides.
# Caddy fronts the stack on 80/443 with TLS for DOMAIN from .env.
# taxi.api is bound to 127.0.0.1:5001 only (no public exposure).
# Seq / Grafana / Prometheus stay on the internal Docker network
# (reach them via SSH tunnel: e.g. `ssh -L 8081:localhost:8081 host`).
#
# Pre-flight:
#   - DNS A record DOMAIN -> server IP
#   - Inbound TCP 80 and 443 open on the firewall
#   - .env populated (POSTGRES_*, JWT_SECRET, STRIPE_*, GRAFANA_ADMIN_PASSWORD, ...)
#
# Run prod :  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Stop prod:  docker compose -f docker-compose.yml -f docker-compose.prod.yml down
# Logs     :  docker compose -f docker-compose.yml -f docker-compose.prod.yml logs -f
# Caddy log:  docker compose -f docker-compose.yml -f docker-compose.prod.yml logs -f caddy

services:
  caddy:
    image: caddy:2-alpine
    restart: always
    environment:
      DOMAIN: ${DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - taxi.api

  # One-shot init: fix ownership of the api-wwwroot named volume so the non-root
  # app user ($APP_UID = 1654 in the .NET image) can create runtime upload
  # sub-dirs (chat/, compensation/, ...). A persisted named volume keeps its own
  # root:root ownership and overlays the image's wwwroot, so the Dockerfile's
  # build-time chmod never reaches it — this heals the volume on every `up`.
  taxi.api-init:
    image: busybox:1.36
    command: sh -c "mkdir -p /app/wwwroot && chown -R 1654:1654 /app/wwwroot"
    user: "0:0"
    volumes:
      - api-wwwroot:/app/wwwroot
    restart: "no"

  taxi.api:
    # Bound to loopback only — Caddy is the public entry point.
    # SSH-tunnel this port for direct API debugging.
    depends_on:
      taxi.api-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # Honor X-Forwarded-Proto from Caddy so Request.Scheme reports
      # https for cookies, OAuth redirects, etc.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=TaxiDb_Prod;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      JwtSettings__Secret: ${JWT_SECRET}
      AppSettings__GoogleMapsApiKey: ${GOOGLE_MAPS_API_KEY}
      AppSettings__FirebaseCredentials: ${FIREBASE_CREDENTIALS}
      AppSettings__ApiBaseUrl: ${API_BASE_URL}
      AppSettings__AllowedOrigins__0: ${APP_ALLOWED_ORIGIN_0}
      AppSettings__Stripe__SecretKey: ${STRIPE_SECRET_KEY}
      AppSettings__Stripe__PublishableKey: ${STRIPE_PUBLISHABLE_KEY}
      AppSettings__Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET}
      AppSettings__Stripe__TestMode: ${STRIPE_TEST_MODE}
      AppSettings__Features__StripeEnabled: ${STRIPE_ENABLED}
      Invoice__Issuer__Name: ${INVOICE_ISSUER_NAME}
      Invoice__Issuer__Address: ${INVOICE_ISSUER_ADDRESS}
      Invoice__Issuer__VatNumber: ${INVOICE_ISSUER_VAT_NUMBER}
      # Auth — OTP policy (backend-owned)
      Otp__HashSecret: ${OTP_HASH_SECRET}
      Otp__CodeLength: ${OTP_CODE_LENGTH:-6}
      Otp__ExpiryMinutes: ${OTP_EXPIRY_MINUTES:-5}
      Otp__MaxAttempts: ${OTP_MAX_ATTEMPTS:-5}
      Otp__ResendCooldownSeconds: ${OTP_RESEND_COOLDOWN_SECONDS:-60}
      Otp__OtpRetentionDays: ${OTP_RETENTION_DAYS:-30}
      # Auth — CM.com SMS
      Sms__CmCom__BaseUrl: ${CM_BASE_URL:-https://gw.messaging.cm.com/}
      Sms__CmCom__ProductToken: ${CM_PRODUCT_TOKEN}
      Sms__CmCom__Sender: ${CM_SENDER:-Fat7i}
      # Auth — Titan.email SMTP
      Email__Titan__Host: ${TITAN_HOST:-smtp.titan.email}
      Email__Titan__Port: ${TITAN_PORT:-465}
      Email__Titan__UseSsl: ${TITAN_USE_SSL:-true}
      Email__Titan__Username: ${TITAN_USERNAME}
      Email__Titan__Password: ${TITAN_PASSWORD}
      Email__Titan__FromEmail: ${TITAN_FROM_EMAIL}
      Email__Titan__FromName: ${TITAN_FROM_NAME:-Fat7i}
      Email__Titan__ReplyToEmail: ${TITAN_REPLY_TO_EMAIL:-}
      ForwardedHeaders__KnownIPNetworks__0: ${FORWARDED_HEADERS_KNOWN_NETWORK_0:-172.16.0.0/12}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://seq:5341/ingest/otlp/v1/traces
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    volumes:
      - api-wwwroot:/app/wwwroot
    restart: always

  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: TaxiDb_Prod
    restart: always

  seq:
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_NOAUTHENTICATION: "false"
    ports:
      - "127.0.0.1:8081:80"
    restart: always

  prometheus:
    ports:
      - "127.0.0.1:9090:9090"
    restart: always

  grafana:
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:3000:3000"
    restart: always

volumes:
  caddy_data:
  caddy_config:
  api-wwwroot:
