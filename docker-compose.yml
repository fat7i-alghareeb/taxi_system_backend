# Base compose file (services without environment-specific settings).
#
# Do NOT run this file alone — it relies on either the dev override
# (auto-loaded) or the prod override (explicit -f flag).
#
# Dev  : docker compose up -d
#        (auto-merges docker-compose.override.yml)
#
# Prod : docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  taxi.api:
    build:
      context: .
      dockerfile: src/Taxi.Api/Dockerfile
      target: final
    depends_on:
      postgres:
        condition: service_healthy
      seq:
        condition: service_started

  postgres:
    image: postgres:16
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  seq:
    image: datalust/seq:latest
    volumes:
      - ./containers/seq:/data

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./containers/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - taxi.api

  grafana:
    image: grafana/grafana:latest
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres-data:
  grafana-data:
