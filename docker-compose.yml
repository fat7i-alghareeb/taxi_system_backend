# Base compose file (services without environment-specific settings).
#
# Do NOT run this file alone — it relies on an explicitly selected environment
# overlay. Neither overlay auto-loads: picking an environment is always deliberate.
#
# Dev  : docker compose -f docker-compose.yml -f docker-compose.dev.yml  up -d
# Prod : docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

# SUPPLY CHAIN — ACTION REQUIRED: seq / prometheus / grafana below still use `:latest`,
# so any rebuild can silently pull a different upstream image. Pin each by digest once,
# then refresh deliberately as its own reviewed change:
#
#   docker image inspect datalust/seq:latest --format '{{index .RepoDigests 0}}'
#
# and paste the resulting `repo@sha256:...` in place of the tag. Digests are not pinned
# here because they must be read from the images you actually intend to run.
services:
  taxi.api:
    build:
      context: .
      dockerfile: src/Taxi.Api/Dockerfile
      target: final
    depends_on:
      postgres:
        condition: service_healthy
      seq:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  postgres:
    image: postgres:16
    security_opt:
      - no-new-privileges:true
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  seq:
    image: datalust/seq:latest
    volumes:
      - ./containers/seq:/data

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./containers/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - taxi.api

  grafana:
    image: grafana/grafana:latest
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres-data:
  grafana-data:
